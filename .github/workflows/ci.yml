name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Syntax check
        run: node --check bin/init.js src/auth.js src/detect.js src/install.js

      - name: Dry-run publish
        run: npm publish --dry-run --access public

      - name: Version bump check
        run: |
          MAIN_VERSION=$(git show origin/main:package.json | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(JSON.parse(d).version))")
          THIS_VERSION=$(node -e "console.log(require('./package.json').version)")
          if [ "$MAIN_VERSION" = "$THIS_VERSION" ]; then
            echo "❌ package.json version ($THIS_VERSION) must be bumped before merging."
            exit 1
          fi
          echo "✓ Version bumped: $MAIN_VERSION → $THIS_VERSION"
